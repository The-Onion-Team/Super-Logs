<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Super-Logs — self-hosted observability for web apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1013"/>
      <stop offset="1" stop-color="#1a1f27"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- mark -->
  <g transform="translate(80 92)">
    <rect width="96" height="18" rx="9" fill="#ff5a64"/>
    <rect y="40" width="62" height="18" rx="9" fill="#f0a53a"/>
    <rect y="80" width="80" height="18" rx="9" fill="#6f7885"/>
  </g>

  <text x="210" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#e6e9ee" letter-spacing="-2">Super-Logs</text>
  <text x="212" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8d96a3">Self-hosted observability for web apps. One container. One SQLite file.</text>

  <!-- faux log lines -->
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" transform="translate(830 60)">
    <rect x="-14" y="-6" width="330" height="190" rx="10" fill="#16191e" stroke="#2a2f37"/>
    <text y="18" fill="#8d96a3">13:37:51 <tspan fill="#6d9cff">INFO </tspan> <tspan fill="#e6e9ee">order 5050 paid</tspan></text>
    <text y="48" fill="#8d96a3">13:37:51 <tspan fill="#f0a53a">WARN </tspan> <tspan fill="#e6e9ee">slow /checkout</tspan></text>
    <text y="78" fill="#8d96a3">13:37:51 <tspan fill="#ff5a64">ERROR</tspan> <tspan fill="#e6e9ee">payment timeout</tspan></text>
    <text y="108" fill="#8d96a3">13:37:51 <tspan fill="#ff5a64">ERROR</tspan> <tspan fill="#e6e9ee">POST → 502</tspan></text>
    <text y="146" fill="#5b8ff9">↳ req_dc2f871e0d35</text>
    <text y="170" fill="#6f7885">  3 events · 2 services</text>
  </g>
</svg>
